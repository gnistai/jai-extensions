[package]
name = "jai-engines"
description = "JAI Studio engines: llama-server and sd-server launch commands, process supervision, the GPU scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
jai-core.workspace = true
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_NetworkManagement_IpHelper"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
